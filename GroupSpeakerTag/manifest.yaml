apiVersion: v1
kind: Plugin
metadata:
  author: Gareth
  name: GroupSpeakerTag
  repository: https://github.com/ThDWARF/GroupSpeakerTag
  version: 0.8.0
  description:
    en_US: Prefix group messages with the speaker's name and ID, fetch QQ images locally into base64, and turn QQ faces (emoji) into readable text.
    zh_Hans: 给群消息加上「发言人昵称(ID)」前缀；QQ 图片在本地转 base64；QQ 表情转成可读文本。
  label:
    en_US: Group Speaker Tag
    zh_Hans: 群发言人标记
  icon: assets/icon.svg
spec:
  config:
    - name: tag-format
      label:
        en_US: Tag Format
        zh_Hans: 标记格式
      description:
        en_US: "Placeholders: {name} = sender display name, {id} = sender platform ID. Examples: [群成员 {name}(ID:{id})] or [{name}]"
        zh_Hans: "可用占位符：{name} = 发言人昵称/群名片，{id} = 发言人平台 ID（QQ 号）。示例：【{name}（QQ:{id}）】 或 【{name}】"
      type: string
      default: "【{name}（QQ:{id}）】"
      required: false
    - name: image-mode
      label:
        en_US: Image Handling
        zh_Hans: 图片处理
      description:
        en_US: "auto = download the image locally and convert to base64 (needed for QQ images); skip = replace with [图片] text, for text-only models."
        zh_Hans: "auto = 在本地下载图片并转成 base64（QQ 图片必须这样做，否则模型看不到）；skip = 用「[图片]」文本占位，适合纯文本模型。"
      type: string
      default: "auto"
      required: false
    - name: inject-guide
      label:
        en_US: Inject Identity Guide
        zh_Hans: 注入身份说明
      description:
        en_US: Append one system message explaining the tag so the model does not treat it as user text.
        zh_Hans: 追加一条系统说明，告诉模型该标记的含义，避免它把标记当成用户正文或复述出来。
      type: boolean
      default: true
      required: false
    - name: tag-quote
      label:
        en_US: Include Quoted Message
        zh_Hans: 附带引用内容
      description:
        en_US: Keep the quoted ("reply to") text in the quoted form when a member replies to someone.
        zh_Hans: 当成员使用「回复」功能时，把被引用的原文一并带上并标注来源。
      type: boolean
      default: true
      required: false
    - name: prompt-dump-scope
      label:
        en_US: "!prompt Access Scope"
        zh_Hans: "!prompt 使用范围"
      description:
        en_US: "Who may run !prompt. Values: admin (default, bot admins and private chat) / everyone (anyone in the group) / off (disable)."
        zh_Hans: "谁可以用 !prompt 查看提示词快照。取值：admin（默认，机器人管理员 + 私聊）/ everyone（群内任何人）/ off（关闭）。注意 everyone 会把系统提示词暴露给群成员。"
      type: string
      default: "admin"
      required: false
    - name: mute-triggers
      label:
        en_US: Quiet Trigger Words
        zh_Hans: 静默触发词
      description:
        en_US: "When a group message contains any of these, the plugin blocks the message and stops replying until woken. Separate multiple words with commas."
        zh_Hans: "群里出现这些词时进入静默：插件直接把消息拦掉，不再回复。多个词用逗号分隔，例如：灵灵安静,安静灵灵"
      type: string
      default: "灵灵安静"
      required: false
    - name: wake-triggers
      label:
        en_US: Wake Words
        zh_Hans: 唤醒词
      description:
        en_US: "While muted, a message containing any of these (or an @mention of the bot) resumes normal replies. Separate with commas."
        zh_Hans: "静默期间，群里出现这些词（或 @机器人）就恢复说话。多个词用逗号分隔，例如：灵灵,出来"
      type: string
      default: "灵灵"
      required: false
    - name: bot-qq
      label:
        en_US: Bot QQ (for @ detection)
        zh_Hans: 机器人 QQ（用于识别 @）
      description:
        en_US: "Optional. Fill in the bot's QQ number so only @-mentions of the bot count as a wake signal. Leave empty to treat any @mention as wake."
        zh_Hans: "可选。填机器人自己的 QQ 号，这样只有 @她 才算唤醒；留空则任意 @ 都算唤醒（可能被 @ 别人误唤醒）。"
      type: string
      default: ""
      required: false
    - name: mute-ack
      label:
        en_US: Quiet Acknowledge Text
        zh_Hans: 静默应答语
      description:
        en_US: "Reply once when entering quiet mode. Leave empty for a completely silent switch."
        zh_Hans: "进入静默时回一句确认（例如：灵灵先不说话了喵）。留空则完全静默，一个字都不发。"
      type: string
      default: ""
      required: false
    - name: silent-tools
      label:
        en_US: Silent Tool Names
        zh_Hans: 保持安静的工具名
      description:
        en_US: "If any of these tools was called this turn, the whole reply is suppressed. Separate with commas."
        zh_Hans: "本轮调用了这些工具时，整条回复都不发送。多个用逗号分隔，默认 stay_silent,no_reply,silent"
      type: string
      default: "stay_silent,no_reply,silent"
      required: false
    - name: silent-marks
      label:
        en_US: Silent Text Marks
        zh_Hans: 静默文字标记
      description:
        en_US: "Fallback: if the reply is only these marks, it is suppressed; if mixed with text, the marks are stripped before sending."
        zh_Hans: "兜底：回复只剩这些标记时不发送；混在正文里则剥掉标记后照发。多个用逗号分隔。"
      type: string
      default: "[[SILENT]],[[silent]],[[静默]]"
      required: false
    - name: silent-marker-dir
      label:
        en_US: Silent Marker Directory
        zh_Hans: 静默标记目录
      description:
        en_US: "Absolute directory where the stay_silent tool drops marker files; LangBot checks it before sending. Must match the patch's default (LangBot data/silent)."
        zh_Hans: "stay_silent 工具落标记文件的绝对目录，LangBot 发送前会扫它。必须和补丁的默认值一致：<LangBot目录>/data/silent"
      type: string
      default: 'D:/Desktop/Ling/langbot/data/silent'
      required: false
  components:
    EventListener:
      fromDirs:
        - path: components/event_listener/
          maxDepth: 1
    Tool:
      fromDirs:
        - path: components/tool/
          maxDepth: 1
execution:
  python:
    path: main.py
    attr: GroupSpeakerTagPlugin
